<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashdrop — Publish HTML instantly</title>
  <meta name="description" content="Drop a single HTML file and get a live link in seconds. Self-hosted static dashboard hosting.">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("dashdrop-theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (_) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/style.css?v=21">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas-pro@1.5.8/dist/html2canvas-pro.min.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a href="/" class="logo">
      <span class="logo-icon">⚡</span>
      Dashdrop
    </a>
    <nav class="site-nav">
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false" title="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 14.3A8.5 8.5 0 0 1 9.7 3a7 7 0 1 0 11.3 11.3z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
      <a href="/library" class="nav-link">Library</a>
    </nav>
  </header>

  <main>
    <section class="upload-hero">
      <h1>Publish HTML in seconds</h1>
      <p>Drop a single HTML file and get a live link instantly. No account, no build step.</p>
    </section>

    <div id="error" class="error-msg" role="alert"></div>

    <div id="upload-section">
      <div id="progress" class="progress-wrap">
        <div class="progress-bar">
          <div class="progress-bar-fill" style="width: 100%"></div>
        </div>
        <p id="progress-label" class="progress-label">Uploading...</p>
      </div>

      <label id="dropzone" class="dropzone">
        <input id="file-input" type="file" accept=".html,.htm,text/html">
        <div class="dropzone-icon">📄</div>
        <h2>Drag &amp; drop your HTML file here</h2>
        <p>or click to browse</p>
        <p class="hint">Single .html files only · Max 5 MB</p>
      </label>
    </div>

    <div id="success" class="success-panel">
      <div class="success-icon">✓</div>
      <h2>Your dashboard is live!</h2>

      <div class="meta-form">
        <label class="field">
          <span class="field-label">Name</span>
          <input id="edit-title" type="text" maxlength="120" autocomplete="off" aria-label="Dashboard name">
        </label>
        <label class="field">
          <span class="field-label">URL slug</span>
          <div class="slug-input-row">
            <span class="slug-prefix" id="slug-prefix"></span>
            <input id="edit-slug" type="text" maxlength="48" autocomplete="off" spellcheck="false" aria-label="URL slug">
          </div>
          <span id="slug-status" class="field-hint" aria-live="polite"></span>
        </label>
        <div class="field">
          <span class="field-label">Tags</span>
          <div id="edit-tags" class="tag-input" data-placeholder="Add a tag and press Enter"></div>
          <span id="tags-status" class="field-hint">Optional · saved as you add them · max 10</span>
        </div>
        <div class="field">
          <span class="field-label">Expires</span>
          <div id="edit-expires-picker" class="expires-picker"></div>
          <span class="field-hint">Optional · archives automatically after this date</span>
        </div>
        <button id="btn-save-meta" type="button" class="btn btn-primary btn-sm" disabled>Save changes</button>
      </div>

      <div class="url-box">
        <input id="published-url" type="text" readonly aria-label="Published URL">
        <button id="btn-copy" type="button" class="btn btn-primary btn-sm">Copy</button>
      </div>
      <div class="success-actions">
        <a id="btn-view" href="#" target="_blank" rel="noopener" class="btn btn-primary">View live</a>
        <a id="btn-browse-library" href="/library" class="btn btn-secondary">Browse library</a>
        <button id="btn-upload-another" type="button" class="btn btn-secondary">Upload another</button>
      </div>
    </div>
  </main>

  <iframe id="thumb-frame" title="Thumbnail capture frame" sandbox="allow-same-origin"></iframe>
  <script src="/js/app.js?v=21"></script>
</body>
</html>
