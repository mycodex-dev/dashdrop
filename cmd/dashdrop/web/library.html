<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library — Dashdrop</title>
  <meta name="description" content="Browse all published HTML dashboards.">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("dashdrop-theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (_) {
        document.documentElement.setAttribute("data-theme", "light");
      }
      try {
        var brand = JSON.parse(localStorage.getItem("dashdrop-brand") || "null");
        if (brand && brand.primary_color && /^#[0-9a-fA-F]{6}$/.test(brand.primary_color)) {
          var root = document.documentElement;
          root.style.setProperty("--brand-primary", brand.primary_color);
          root.style.setProperty("--accent", brand.primary_color);
        }
      } catch (_) { /* ignore */ }
    })();
  </script>
  <link rel="stylesheet" href="/css/style.css?v=26">
</head>
<body>
  <header class="site-header">
    <a href="/" class="logo">
      <span class="logo-icon" data-brand-logo>⚡</span>
      <span data-brand-name>Dashdrop</span>
    </a>
    <nav class="site-nav">
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false" title="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 14.3A8.5 8.5 0 0 1 9.7 3a7 7 0 1 0 11.3 11.3z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
      <a href="/settings" class="nav-icon-link" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </a>
      <a href="/" class="nav-link">Upload</a>
    </nav>
  </header>

  <main>
    <div class="library-header">
      <div>
        <h1>Dashboard Library</h1>
        <p id="dashboard-count" class="library-count">Loading...</p>
      </div>
      <a href="/" class="btn btn-primary btn-upload">
        <span class="btn-upload-icon" aria-hidden="true">+</span>
        Upload Dashboard
      </a>
    </div>

    <div id="library-toolbar" class="library-toolbar" style="display: none" aria-label="Organize library">
      <label class="library-search">
        <span class="visually-hidden">Search dashboards</span>
        <span class="library-search-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="7" cy="7" r="5.25" stroke="currentColor" stroke-width="1.5"/>
            <path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
        <input id="library-search" type="search" placeholder="Search dashboards..." autocomplete="off">
        <kbd id="library-search-kbd" class="library-search-kbd" aria-hidden="true">⌘K</kbd>
      </label>
      <div class="library-toolbar-right">
        <button type="button" id="btn-archived-mode" class="library-mode-btn" aria-pressed="false">
          Archived
        </button>
        <label class="library-sort">
          <span class="visually-hidden">Sort by</span>
          <select id="library-sort" aria-label="Sort dashboards">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="name-asc">Name A–Z</option>
            <option value="name-desc">Name Z–A</option>
          </select>
        </label>
        <div class="view-toggle" role="group" aria-label="View mode">
          <button type="button" id="view-grid" class="view-toggle-btn active" aria-pressed="true" title="Grid view">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
            <span class="visually-hidden">Grid</span>
          </button>
          <button type="button" id="view-list" class="view-toggle-btn" aria-pressed="false" title="List view">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2" width="14" height="3" rx="1"/><rect x="1" y="6.5" width="14" height="3" rx="1"/><rect x="1" y="11" width="14" height="3" rx="1"/></svg>
            <span class="visually-hidden">List</span>
          </button>
        </div>
      </div>
    </div>

    <div id="tag-filter" class="tag-filter" style="display: none" aria-label="Filter by tag"></div>

    <div id="loading" class="loading">Loading dashboards...</div>

    <div id="empty-state" class="empty-state" style="display: none">
      <div class="empty-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </div>
      <h2 id="empty-state-title">No dashboards yet</h2>
      <p id="empty-state-text">Upload your first HTML dashboard.</p>
      <a href="/" id="empty-state-upload" class="btn btn-primary btn-upload">
        <span class="btn-upload-icon" aria-hidden="true">+</span>
        Upload Dashboard
      </a>
      <button type="button" id="btn-back-library" class="btn btn-secondary" style="display: none">Back to library</button>
    </div>

    <div id="empty-filter" class="empty-state" style="display: none">
      <div class="empty-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="M20 20l-3-3"/>
        </svg>
      </div>
      <h2 id="empty-filter-title">No matching dashboards</h2>
      <p id="empty-filter-text">No dashboards have this tag.</p>
      <button type="button" id="btn-clear-filter" class="btn btn-secondary">Clear filters</button>
    </div>

    <div id="dashboard-grid" class="dashboard-grid view-grid" style="display: none"></div>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <a href="/" class="site-footer-brand">
        <span class="logo-icon" data-brand-logo aria-hidden="true">⚡</span>
        <span data-brand-name>Dashdrop</span>
      </a>
      <p class="site-footer-meta">Self-hosted HTML hosting · Drop a file, get a live link</p>
    </div>
  </footer>

  <input id="replace-input" type="file" accept=".html,.htm,text/html" hidden>
  <iframe id="thumb-frame" title="Thumbnail capture frame" sandbox="allow-same-origin"></iframe>
  <script src="/js/app.js?v=26"></script>
</body>
</html>
