<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library — Dashdrop</title>
  <meta name="description" content="Browse all published HTML dashboards.">
  <link rel="stylesheet" href="/css/style.css?v=15">
</head>
<body>
  <header class="site-header">
    <a href="/" class="logo">
      <span class="logo-icon">⚡</span>
      Dashdrop
    </a>
    <nav>
      <a href="/" class="nav-link">Upload</a>
    </nav>
  </header>

  <main>
    <div class="library-header">
      <div>
        <h1>Dashboard Library</h1>
        <p id="dashboard-count" class="library-count">Loading...</p>
      </div>
      <a href="/" class="btn btn-primary btn-upload">
        <span class="btn-upload-icon" aria-hidden="true">+</span>
        Upload Dashboard
      </a>
    </div>

    <div id="library-toolbar" class="library-toolbar" style="display: none" aria-label="Organize library">
      <label class="library-search">
        <span class="visually-hidden">Search dashboards</span>
        <span class="library-search-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="7" cy="7" r="5.25" stroke="currentColor" stroke-width="1.5"/>
            <path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
        <input id="library-search" type="search" placeholder="Search dashboards..." autocomplete="off">
        <kbd id="library-search-kbd" class="library-search-kbd" aria-hidden="true">⌘K</kbd>
      </label>
      <div class="library-toolbar-right">
        <label class="library-sort">
          <span class="visually-hidden">Sort by</span>
          <select id="library-sort" aria-label="Sort dashboards">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="name-asc">Name A–Z</option>
            <option value="name-desc">Name Z–A</option>
          </select>
        </label>
        <div class="view-toggle" role="group" aria-label="View mode">
          <button type="button" id="view-grid" class="view-toggle-btn active" aria-pressed="true" title="Grid view">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
            <span class="visually-hidden">Grid</span>
          </button>
          <button type="button" id="view-list" class="view-toggle-btn" aria-pressed="false" title="List view">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2" width="14" height="3" rx="1"/><rect x="1" y="6.5" width="14" height="3" rx="1"/><rect x="1" y="11" width="14" height="3" rx="1"/></svg>
            <span class="visually-hidden">List</span>
          </button>
        </div>
      </div>
    </div>

    <div id="tag-filter" class="tag-filter" style="display: none" aria-label="Filter by tag"></div>

    <div id="loading" class="loading">Loading dashboards...</div>

    <div id="empty-state" class="empty-state" style="display: none">
      <div class="empty-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </div>
      <h2>No dashboards yet</h2>
      <p>Upload your first HTML dashboard.</p>
      <a href="/" class="btn btn-primary btn-upload">
        <span class="btn-upload-icon" aria-hidden="true">+</span>
        Upload Dashboard
      </a>
    </div>

    <div id="empty-filter" class="empty-state" style="display: none">
      <div class="empty-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="M20 20l-3-3"/>
        </svg>
      </div>
      <h2 id="empty-filter-title">No matching dashboards</h2>
      <p id="empty-filter-text">No dashboards have this tag.</p>
      <button type="button" id="btn-clear-filter" class="btn btn-secondary">Clear filters</button>
    </div>

    <div id="dashboard-grid" class="dashboard-grid view-grid" style="display: none"></div>
  </main>

  <input id="replace-input" type="file" accept=".html,.htm,text/html" hidden>
  <iframe id="thumb-frame" title="Thumbnail capture frame" sandbox="allow-same-origin allow-scripts"></iframe>
  <script src="/js/app.js?v=13"></script>
</body>
</html>
